function tags(h){return new Set([...(roleTags[h.role]||[]),...(h.tags||[]),...(h.playstyleTags||[])]);}
function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x));}
function statAffinity(h,q){
 const st=h.stats||{},mv=h.movement||{};
 if(q.tag==='耐久' && st.hp!=null && st.defense!=null)return clamp((st.hp*.75+st.defense*.25-.5),0,1.1);
 if(q.tag==='攻撃' && st.attack!=null)return clamp((st.attack-.55)*1.2,0,1.1);
 if(q.tag==='機動力' && mv.walkSeconds!=null)return clamp((12.5-mv.walkSeconds)/4.8,0,1.1);
 if(q.tag==='低耐久' && st.hp!=null)return clamp((.95-st.hp)*1.7,0,1);
 return 0;
}
function affinity(h,q){

function chooseQuestion(){
 if(history.length<core.length)return core[history.length];
 const used=new Set(history.map(a=>a.q));
 const candidates=ranked().slice(0,Math.max(8,Math.round(24-history.length*.55)));
 // Prefer questions that split plausible heroes, not questions all finalists answer alike.
 // Keep related variants from repeating unless they offer unusually strong separation.
 const maxScore=Math.max(...candidates.map(x=>x.score));
 const weights=candidates.map(x=>Math.exp((x.score-maxScore)/Math.max(1.5,4-history.length*.1)));
 const totalWeight=weights.reduce((a,b)=>a+b,0);
 let best=-1,bv=-Infinity;
 for(let i=0;i<questions.length;i++){
   if(used.has(i))continue;
   const q=questions[i];
   const vals=candidates.map(x=>match(x.h,q));
   const avg=vals.reduce((a,v,j)=>a+v*weights[j],0)/totalWeight;
   const variance=vals.reduce((a,v,j)=>a+weights[j]*(v-avg)**2,0)/totalWeight;
   const positive=vals.reduce((a,v,j)=>a+(v>.25?weights[j]:0),0)/totalWeight;
   const balance=1-Math.abs(positive-.5)*2;
   const sameFamily=history.filter(a=>questions[a.q].family===q.family).length;
   const sameCategory=history.filter(a=>questions[a.q].category===q.category).length;
   const unknown=history.some(a=>a.choice==='unknown'&&questions[a.q].family===q.family);
   const uncertainty=history.filter(a=>a.choice==='neutral'||a.choice==='unknown').length;
   // A moderate preference for broad, reliable differentiators when many answers are uncertain.
   const broad=['機動力','攻撃','支援','防衛','妨害','遠距離','近距離','耐久','戦略','万能'];
   const broadBonus=uncertainty>=4&&broad.includes(q.tag)?.035:0;
   const value=variance*1.6+balance*.13+positive*.03+ broadBonus
     -sameFamily*.20-sameCategory*.075-(unknown?.10:0);
   if(value>bv){bv=value;best=i;}
 }

}

for(let i=0;i<list.length;i++){const {h:hero,score:points}=list[i];const d=document.createElement('div');d.className='result hero-result';const name=document.createElement('strong');name.textContent=`${i+1}位：${hero.name}`;const role=document.createElement('p');role.className='muted';role.textContent=hero.role;d.append(name,role);if(!hero.imageUrl){const missing=document.createElement('p');missing.className='warn';missing.textContent='画像確認中（誤った画像を非表示にしています）';d.append(missing);}if(hero.imageUrl){const img=document.createElement('img');img.className='hero-art';img.src=hero.imageUrl;img.alt=hero.name+'の立ち絵';img.loading='lazy';img.addEventListener('error',()=>{img.replaceWith(document.createTextNode('画像を読み込めませんでした'))});d.append(img);}const matched=history.filter(a=>a.choice==='yes'&&affinity(hero,questions[a.q])>.5);const reason=document.createElement('p');reason.className='note';const examples=matched.slice(0,3).map(a=>'「'+questions[a.q].text+'」に「はい」');reason.textContent=examples.length?'相性の根拠：'+examples.join('、')+'という回答が特徴と一致しました。':'攻め方・守り方の回答全体から選んだ候補です。';reason.textContent+=' ※ヒーローの特徴は仮評価を含みます。';d.append(reason);if(i===0&&hero.cardGuideImage){const guide=document.createElement('section');guide.className='card-guide';const heading=document.createElement('h3');heading.textContent='よく使われるカード一覧';const note=document.createElement('p');note.className='note';note.textContent='通常カード8枚＋コラボカード8枚（ユーザー提供画像）。採用率や最適デッキを保証するものではありません。';const guideImg=document.createElement('img');guideImg.className='card-guide-image';guideImg.src=hero.cardGuideImage;guideImg.alt=hero.name+'のよく使われるカード一覧（通常カード・コラボカード）';guideImg.loading='lazy';guideImg.addEventListener('error',()=>{guideImg.replaceWith(document.createTextNode('カード一覧画像を読み込めませんでした'))});guide.append(heading,note,guideImg);d.append(guide);}if(i===0&&hero.id==='h37'){const roast=document.createElement('div');roast.className='rinne-roast';const headline=document.createElement('h3');headline.textContent='🎉 おめでとうございます！あなたはクズです！';const body=document.createElement('p');body.textContent='罠で相手を翻弄する戦い方が、あなたの回答と一致しました。';const foot=document.createElement('p');foot.className='note';foot.textContent='※ゲーム内の罠プレイに対するネタ演出です。人格を判定するものではありません。';roast.append(headline,body,foot);d.append(roast);}app.append(d);}
const review=document.createElement('details');review.className='result';const summary=document.createElement('summary');summary.textContent='回答を振り返る';review.append(summary);const ol=document.createElement('ol');ol.className='answer-review';for(const a of history){const li=document.createElement('li');li.textContent=questions[a.q].text+' → '+({yes:'はい',no:'いいえ',neutral:'どちらでもない',unknown:'わからない'}[a.choice]||'未回答');ol.append(li);}review.append(ol);app.append(review);const row=document.createElement('div');row.className='buttons';row.append(button('もう一度診断する',reset),button('1問戻る',back,true));app.append(row);}
function renderCatalog(){const grid=document.getElementById('hero-grid');if(!grid||grid.childElementCount)return;const frag=document.createDocumentFragment();for(const h of heroes){const d=document.createElement('div');d.className='hero-tile';const img=document.createElement(h.imageUrl?'img':'p');if(h.imageUrl){img.src=h.imageUrl;img.alt=h.name+'の立ち絵';img.loading='lazy';img.addEventListener('error',()=>{const fallback=document.createElement('p');fallback.className='note';fallback.textContent='画像を読み込めません';img.replaceWith(fallback)});}else{img.className='note';img.textContent='画像確認中';}const name=document.createElement('strong');name.textContent=h.name;d.append(img,name);frag.append(d);}grid.append(frag);}
try{heroes=JSON.parse(document.getElementById('hero-data').textContent);if(heroes.length!==51)throw Error('ヒーローデータが不完全です');render();document.getElementById('hero-catalog').addEventListener('toggle',e=>{if(e.target.open)renderCatalog();});}catch(e){app.textContent='読み込みエラー：'+e.message;}
</script></body></html>
